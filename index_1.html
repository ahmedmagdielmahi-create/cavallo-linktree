<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cavallo Stone — Links</title>
<style>
  :root{
    --bg1:#0e0e11;
    --bg2:#1b1b22;
    --card:rgba(255,255,255,0.05);
    --card-hover:rgba(255,255,255,0.10);
    --border:rgba(255,255,255,0.12);
    --text:#f4f4f5;
    --muted:#a9a9b2;
    --accent:#c9a24b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI',Tahoma,system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(201,162,75,0.18), transparent 60%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--text);
    min-height:100%;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:48px 18px 60px;
  }
  .wrap{width:100%;max-width:520px;}
  .header{text-align:center;margin-bottom:34px;}
  .avatar{
    width:190px;height:auto;border-radius:18px;
    margin:0 auto 18px;
    display:block;
    overflow:hidden;
    border:2px solid var(--accent);
    box-shadow:0 10px 34px rgba(0,0,0,0.5);
  }
  .avatar img{width:100%;height:auto;display:block;}
  .name{font-size:26px;font-weight:700;letter-spacing:.5px;}
  .name span{color:var(--accent);}
  .tagline{color:var(--muted);font-size:14.5px;margin-top:8px;direction:ltr;}
  .links{display:flex;flex-direction:column;gap:14px;margin-top:30px;}
  .link{
    display:flex;align-items:center;gap:14px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:15px 18px;
    color:var(--text);
    text-decoration:none;
    font-size:16px;font-weight:600;
    transition:transform .16s ease, background .16s ease, border-color .16s ease;
    backdrop-filter:blur(6px);
  }
  .link:hover{
    background:var(--card-hover);
    transform:translateY(-2px);
    border-color:var(--accent);
  }
  .ic{
    width:26px;height:26px;flex:0 0 26px;
    display:flex;align-items:center;justify-content:center;
  }
  .ic svg{width:24px;height:24px;fill:currentColor;}
  .label{flex:1;}
  .chev{color:var(--muted);font-size:18px;direction:ltr;}
  .qr{
    margin:34px auto 0;
    width:150px;padding:12px;
    background:#fff;border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
  }
  .qr img{width:100%;display:block;border-radius:6px;}
  .qr-cap{text-align:center;color:var(--muted);font-size:12.5px;margin-top:10px;direction:ltr;letter-spacing:.4px;}
  .footer{
    text-align:center;margin-top:36px;color:var(--muted);font-size:12.5px;
    direction:ltr;letter-spacing:.4px;
  }
  /* brand tints on hover */
  .facebook:hover{color:#1877F2;}
  .instagram:hover{color:#E1306C;}
  .threads:hover{color:#ffffff;}
  .tiktok:hover{color:#25F4EE;}
  .snapchat:hover{color:#FFFC00;}
  .linkedin:hover{color:#0A66C2;}
  .email:hover{color:var(--accent);}
</style>
</head>
